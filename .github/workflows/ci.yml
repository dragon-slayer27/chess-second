name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (Stockfish for real, the language model replaced by scripted replies)
        env:
          STOCKFISH_PATH: /usr/games/stockfish
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build the Render image
        run: docker build -t chess-second .
      - name: Smoke test the container
        run: |
          docker run -d --name second -p 10000:10000 -e SECOND_PUBLIC_DEMO=1 -e SECOND_LLM_BACKEND=none chess-second
          for i in $(seq 1 30); do curl -sf localhost:10000/healthz && break; sleep 1; done
          curl -sf localhost:10000/healthz | grep '"stockfish":true'
          curl -sf localhost:10000/ | grep -q "Review the games"
          curl -sf localhost:10000/samples | grep -q "Sample reviews"
      - name: Container logs
        if: always()
        run: docker logs second || true
