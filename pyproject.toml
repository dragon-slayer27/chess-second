[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-second"
version = "0.1.0"
description = "Game reviews for chess coaches: Stockfish finds the mistakes, an open-weight Gemma model explains them, code checks every claim."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "zstandard>=0.22"]

[project.scripts]
second = "second.__main__:main"

[tool.setuptools]
packages = ["second"]

[tool.setuptools.package-data]
second = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["second", "conftest"]
